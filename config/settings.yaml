websocket:
  url: "wss://pumpdev.io/ws"
  ping_interval: 20
  ping_timeout: 20
  inactivity_timeout_seconds: 35
  reconnect_min_delay: 1.0
  reconnect_max_delay: 30.0
  max_tracked_trade_tokens: 100

rpc:
  # Primary endpoint (replace with your private Helius / QuickNode / Triton key for heavy block-0 inspection)
  endpoint: "https://api.mainnet-beta.solana.com"
  backup_endpoints:
    - "https://solana-rpc.publicnode.com"
  timeout_seconds: 15
  rate_limit_rps: 5
  max_retries: 3

storage:
  database_path: "data/nemo_research.duckdb"
  batch_size: 50
  flush_interval_seconds: 5.0

forensics_thresholds:
  max_block0_bought_supply_ratio: 0.15
  max_dev_initial_buy_ratio: 0.10
  min_entropy_threshold: 2.0
  max_hhi_warning: 2500
  cluster_share_ratio_warning: 0.20
